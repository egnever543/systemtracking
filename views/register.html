<!DOCTYPE html>
<html lang="{{locale}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{t_registerTitle}} — MeuFluxo</title>
  <script>if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#18181b', 'wa-dark': '#000000' } } } }</script>
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="/assets/theme.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center">
  <button onclick="toggleTheme()" class="fixed top-4 right-4 text-gray-400 hover:text-gray-600 p-2 rounded-lg bg-white border border-gray-200 transition-colors" title="Alternar tema">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
  </button>
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-black rounded-2xl mb-4">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 3-2 3H3V7z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7h3a3 3 0 010 6h-3"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">MeuFluxo</h1>
      <p class="text-gray-500 text-sm mt-1">{{t_registerSubtitle}}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <script>
        const params = new URLSearchParams(window.location.search);
        const erro = params.get('erro');
        if (erro) {
          document.write('<div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">' + decodeURIComponent(erro) + '</div>');
        }
      </script>

      <form method="POST" action="/register">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">{{t_nameLabel}}</label>
          <input
            type="text"
            name="nome"
            required
            autocomplete="name"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent"
            placeholder="{{t_namePlaceholder}}"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">{{t_emailLabel}}</label>
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent"
            placeholder="seu@email.com"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input
            type="password"
            name="senha"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent"
            placeholder="Mínimo 8 caracteres"
          />
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar senha</label>
          <input
            type="password"
            name="confirmar_senha"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent"
            placeholder="Repita a senha"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-wa hover:bg-wa-dark text-white font-medium py-2.5 px-4 rounded-lg transition-colors"
        >
          Criar conta
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Já tem conta?
        <a href="/login" class="text-wa font-medium hover:underline">Entrar</a>
      </p>
    </div>
  </div>
</body>
</html>
