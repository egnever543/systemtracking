<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sites — MeuFluxo</title>
  <script>if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#18181b', 'wa-dark': '#000000' } } } }</script>
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="/assets/theme.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 3-2 3H3V7z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7h3a3 3 0 010 6h-3"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">MeuFluxo</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">{{t_navHome}}</a>
      <a href="/dashboard/sites" class="text-sm font-medium text-gray-900">{{t_navSites}}</a>
      <a href="/billing" class="text-sm text-gray-600 hover:text-gray-900">{{t_navSubscription}}</a>
      <a href="/dashboard/docs" class="text-sm text-gray-600 hover:text-gray-900">{{t_navDocs}}</a>
      <a href="/dashboard/conversoes/registrar" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">{{t_navRegisterSale}}</a>
      <a href="/dashboard/settings" class="text-sm text-gray-600 hover:text-gray-900">{{t_navSettings}}</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">{{t_navLogout}}</a>
      <button onclick="setLocale('{{localToggleTarget}}')" class="text-xs text-gray-400 hover:text-gray-600 font-medium px-1.5 py-0.5 rounded border border-gray-200 hover:border-gray-300 transition-colors" title="Change language">{{t_langToggle}}</button>
      <button onclick="toggleTheme()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded" title="Alternar tema">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>
  {{subscriptionBanner}}
  <main class="max-w-6xl mx-auto px-4 py-6" x-data="sitesPage()">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900">{{t_sitesMySites}}</h1>
        <p class="text-gray-500 text-sm">{{t_sitesSubtitle}}</p>
      </div>
      <a href="/dashboard/sites/novo" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        {{t_sitesNewSite}}
      </a>
    </div>

    <template x-if="sites.length === 0">
      <div class="bg-white rounded-xl border border-gray-100 p-12 text-center">
        <p class="text-4xl mb-3">🌐</p>
        <p class="font-medium text-gray-900 mb-1">{{t_sitesEmpty}}</p>
        <p class="text-sm text-gray-500 mb-4">{{t_sitesEmptyDesc}}</p>
        <a href="/dashboard/sites/novo" class="inline-block bg-wa hover:bg-wa-dark text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          {{t_sitesAddFirst}}
        </a>
      </div>
    </template>

    <div class="grid gap-4">
      <template x-for="site in sites" :key="site.id">
        <div class="bg-white rounded-xl border border-gray-100 p-5 flex flex-col md:flex-row md:items-center gap-4">
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-gray-900" x-text="site.name"></p>
            <p class="text-sm text-gray-500" x-text="site.domain"></p>
          </div>
          <div class="flex items-center gap-6 text-center">
            <div>
              <p class="text-lg font-bold text-gray-900" x-text="site.cliques30d"></p>
              <p class="text-xs text-gray-500">{{t_sitesClicks30d}}</p>
            </div>
            <div>
              <p class="text-lg font-bold text-wa" x-text="site.totalConversoes"></p>
              <p class="text-xs text-gray-500">{{t_sitesConversions}}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button @click="copySnippet(site.id)" class="text-sm border border-gray-200 hover:border-gray-300 px-3 py-1.5 rounded-lg transition-colors text-gray-600">
              {{t_sitesCopySnippet}}
            </button>
            <a :href="'/dashboard/sites/' + site.id" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg transition-colors text-gray-700 font-medium">
              {{t_sitesViewDetails}}
            </a>
            <button @click="deletar(site.id, site.name)"
              class="text-sm border border-red-200 hover:bg-red-50 text-red-500 px-3 py-1.5 rounded-lg transition-colors">
              {{t_sitesDelete}}
            </button>
          </div>
        </div>
      </template>
    </div>

    <!-- Toast de copiado -->
    <div x-show="toast" x-transition class="fixed bottom-4 right-4 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg">
      {{t_sitesSnippetCopied}}
    </div>
  </main>

  <script>
  function setLocale(locale) {
    document.cookie = 'locale=' + locale + ';path=/;max-age=31536000';
    location.reload();
  }
</script>
  <script>
    const BASE_URL = '{{baseUrl}}';
    const SITES_DATA = {{sitesJSON}};

    function sitesPage() {
      return {
        sites: SITES_DATA,
        toast: false,
        copySnippet(siteId) {
          const snippet = `<script src="${BASE_URL}/tracker.js" data-site="${siteId}" async><\/script>`;
          navigator.clipboard.writeText(snippet).then(() => {
            this.toast = true;
            setTimeout(() => this.toast = false, 2500);
          });
        },
        async deletar(siteId, siteName) {
          if (!confirm(`Excluir "${siteName}"?\n\nEsta ação é permanente e remove todos os cliques, conversões e configurações.`)) return;
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = `/dashboard/sites/${siteId}/deletar`;
          document.body.appendChild(form);
          form.submit();
        },
      };
    }
  </script>
</body>
</html>
