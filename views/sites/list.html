<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sites — WA CAPI Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#25D366', 'wa-dark': '#128C7E' } } } }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-wa rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">WA CAPI</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">Início</a>
      <a href="/dashboard/sites" class="text-sm font-medium text-gray-900">Sites</a>
      <a href="/billing" class="text-sm text-gray-600 hover:text-gray-900">Assinatura</a>
      <a href="/dashboard/conversoes/registrar" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">+ Registrar Venda</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">Sair</a>
    </div>
  </nav>
  {{subscriptionBanner}}
  <main class="max-w-6xl mx-auto px-4 py-6" x-data="sitesPage()">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Meus Sites</h1>
        <p class="text-gray-500 text-sm">Gerencie os sites conectados ao WA CAPI</p>
      </div>
      <a href="/dashboard/sites/novo" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        + Novo Site
      </a>
    </div>

    <template x-if="sites.length === 0">
      <div class="bg-white rounded-xl border border-gray-100 p-12 text-center">
        <p class="text-4xl mb-3">🌐</p>
        <p class="font-medium text-gray-900 mb-1">Nenhum site cadastrado ainda</p>
        <p class="text-sm text-gray-500 mb-4">Adicione seu primeiro site para começar a rastrear cliques no WhatsApp.</p>
        <a href="/dashboard/sites/novo" class="inline-block bg-wa hover:bg-wa-dark text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
          Adicionar meu primeiro site
        </a>
      </div>
    </template>

    <div class="grid gap-4">
      <template x-for="site in sites" :key="site.id">
        <div class="bg-white rounded-xl border border-gray-100 p-5 flex flex-col md:flex-row md:items-center gap-4">
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-gray-900" x-text="site.name"></p>
            <p class="text-sm text-gray-500" x-text="site.domain"></p>
          </div>
          <div class="flex items-center gap-6 text-center">
            <div>
              <p class="text-lg font-bold text-gray-900" x-text="site.cliques30d"></p>
              <p class="text-xs text-gray-500">Cliques (30d)</p>
            </div>
            <div>
              <p class="text-lg font-bold text-wa" x-text="site.totalConversoes"></p>
              <p class="text-xs text-gray-500">Conversões</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button @click="copySnippet(site.id)" class="text-sm border border-gray-200 hover:border-gray-300 px-3 py-1.5 rounded-lg transition-colors text-gray-600">
              Copiar snippet
            </button>
            <a :href="'/dashboard/sites/' + site.id" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg transition-colors text-gray-700 font-medium">
              Ver detalhes
            </a>
          </div>
        </div>
      </template>
    </div>

    <!-- Toast de copiado -->
    <div x-show="toast" x-transition class="fixed bottom-4 right-4 bg-gray-900 text-white text-sm px-4 py-2 rounded-lg">
      Snippet copiado!
    </div>
  </main>

  <script>
    const BASE_URL = '{{baseUrl}}';
    const SITES_DATA = {{sitesJSON}};

    function sitesPage() {
      return {
        sites: SITES_DATA,
        toast: false,
        copySnippet(siteId) {
          const snippet = `<script src="${BASE_URL}/tracker.js" data-site="${siteId}" async><\/script>`;
          navigator.clipboard.writeText(snippet).then(() => {
            this.toast = true;
            setTimeout(() => this.toast = false, 2500);
          });
        }
      };
    }
  </script>
</body>
</html>
