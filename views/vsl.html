<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{{pageTitle}}</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: {{bgColor}};
      --accent: {{accentColor}};
      --accent-18: {{accentRgba18}};
      --accent-30: {{accentRgba30}};
      --accent-40: {{accentRgba40}};
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 90% 55% at 50% -5%, var(--accent-18), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    /* Logo */
    .logo-wrap { margin-bottom: 22px; }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 0 6px var(--accent-18);
      display: block;
    }
    .logo-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--accent-18);
      border: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 6px var(--accent-18);
    }
    .logo-icon svg { width: 46px; height: 46px; color: var(--accent); }
    /* Text */
    h1 {
      color: #fff;
      font-size: clamp(1.45rem, 5.5vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    .subtitle {
      color: rgba(255,255,255,0.62);
      font-size: 1rem;
      line-height: 1.65;
      margin-bottom: 28px;
      max-width: 500px;
    }
    /* Video */
    .video-wrap {
      width: 100%;
      margin-bottom: 28px;
    }
    .video-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 16px;
      overflow: hidden;
    }
    .video-ratio iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 16px;
    }
    /* CTA */
    .cta-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      background: var(--accent);
      color: #000;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      padding: 18px 24px;
      border-radius: 100px;
      box-shadow: 0 8px 32px var(--accent-40);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.4s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    .cta:active {
      transform: scale(0.97);
      box-shadow: 0 4px 16px var(--accent-30);
    }
    .cta.hidden-cta {
      opacity: 0;
      pointer-events: none;
    }
    .cta svg { width: 23px; height: 23px; fill: #000; flex-shrink: 0; }
    .trust {
      font-size: 0.77rem;
      color: rgba(255,255,255,0.38);
    }
    .countdown {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    {{logoHtml}}
    <h1>{{title}}</h1>
    {{subtitleHtml}}
    <div class="video-wrap">
      <div class="video-ratio">
        <iframe
          src="{{videoEmbedUrl}}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          loading="lazy"
        ></iframe>
      </div>
    </div>
    <div class="cta-wrap">
      <p class="countdown" id="countdown"></p>
      <a href="{{whatsappUrl}}" class="cta hidden-cta" id="ctaBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        {{ctaText}}
      </a>
      <span class="trust" id="trustText" style="display:none">🔒 Conversa segura e privada</span>
    </div>
  </div>
  <script>
    (function () {
      var delayMs = {{delayMs}};
      var btn = document.getElementById('ctaBtn');
      var countdown = document.getElementById('countdown');
      var trustText = document.getElementById('trustText');

      function showCta() {
        btn.classList.remove('hidden-cta');
        countdown.textContent = '';
        trustText.style.display = '';
      }

      if (delayMs <= 0) {
        showCta();
      } else {
        var remaining = Math.ceil(delayMs / 1000);
        countdown.textContent = 'Disponível em ' + remaining + 's';
        var interval = setInterval(function () {
          remaining--;
          if (remaining <= 0) {
            clearInterval(interval);
            showCta();
          } else {
            countdown.textContent = 'Disponível em ' + remaining + 's';
          }
        }, 1000);
      }
    })();
  </script>
</body>
</html>
