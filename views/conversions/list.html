<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversões — MeuFluxo</title>
  <script>if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#18181b', 'wa-dark': '#000000' } } } }</script>
  <link rel="stylesheet" href="/assets/theme.css">
  <script src="/assets/theme.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 3-2 3H3V7z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7h3a3 3 0 010 6h-3"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">MeuFluxo</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">{{t_navHome}}</a>
      <a href="/dashboard/sites" class="text-sm text-gray-600 hover:text-gray-900">{{t_navSites}}</a>
      <a href="/dashboard/conversoes" class="text-sm font-medium text-gray-900">Conversões</a>
      <a href="/billing" class="text-sm text-gray-600 hover:text-gray-900">{{t_navSubscription}}</a>
      <a href="/dashboard/conversoes/registrar" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">{{t_navRegisterSale}}</a>
      <a href="/dashboard/settings" class="text-sm text-gray-600 hover:text-gray-900">{{t_navSettings}}</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">{{t_navLogout}}</a>
      <button onclick="setLocale('{{localToggleTarget}}')" class="text-xs text-gray-400 hover:text-gray-600 font-medium px-1.5 py-0.5 rounded border border-gray-200 hover:border-gray-300 transition-colors" title="Change language">{{t_langToggle}}</button>
      <button onclick="toggleTheme()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded" title="Alternar tema">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </nav>
  {{subscriptionBanner}}

  <main class="max-w-7xl mx-auto px-4 py-6" x-data="conversoesList()" x-init="init()">

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Conversões</h1>
        <p class="text-sm text-gray-500 mt-0.5">Todas as vendas registradas com detalhes de origem e rastreamento.</p>
      </div>
    </div>

    <!-- Filtros -->
    <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5 flex flex-wrap gap-3 items-center">
      <select x-model="filtroSite" @change="pagina = 1; carregar()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-2 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-wa">
        <option value="">Todos os sites</option>
        <template x-for="s in sites" :key="s.id">
          <option :value="s.id" x-text="s.name"></option>
        </template>
      </select>

      <select x-model="filtroDias" @change="pagina = 1; carregar()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-2 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-wa">
        <option value="">Todo o período</option>
        <option value="7">Últimos 7 dias</option>
        <option value="30">Últimos 30 dias</option>
        <option value="90">Últimos 90 dias</option>
      </select>

      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-gray-400" x-text="total + ' conversão' + (total !== 1 ? 'ões' : '')"></span>
        <span class="text-xs font-semibold text-wa" x-text="formatCurrency(totalValor, 'BRL')"></span>
      </div>
    </div>

    <!-- Tabela -->
    <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">

      <template x-if="carregando">
        <div class="p-6 space-y-2">
          <template x-for="i in [1,2,3,4,5]" :key="i">
            <div class="h-12 bg-gray-100 rounded animate-pulse"></div>
          </template>
        </div>
      </template>

      <template x-if="!carregando && conversoes.length === 0">
        <div class="p-12 text-center text-sm text-gray-400">Nenhuma conversão encontrada.</div>
      </template>

      <template x-if="!carregando && conversoes.length > 0">
        <div>
          <table class="w-full text-sm">
            <thead class="border-b border-gray-100">
              <tr class="text-xs text-gray-500">
                <th class="text-left px-4 py-3 font-medium">Código</th>
                <th class="text-left px-4 py-3 font-medium">Site</th>
                <th class="text-left px-4 py-3 font-medium">Horário da venda</th>
                <th class="text-left px-4 py-3 font-medium">Origem</th>
                <th class="text-left px-4 py-3 font-medium">Plataforma</th>
                <th class="text-right px-4 py-3 font-medium">Valor</th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="c in conversoes" :key="c.id">
                <tr>
                  <!-- Linha principal -->
                  <td colspan="7" class="p-0">
                    <div class="border-b border-gray-50">

                      <!-- Linha resumo -->
                      <div class="grid grid-cols-[1fr_1fr_1.5fr_1fr_1fr_1fr_40px] items-center px-4 py-3 hover:bg-gray-50 transition-colors cursor-pointer"
                           @click="c._aberto = !c._aberto">

                        <div>
                          <code class="text-xs bg-gray-100 px-1.5 py-0.5 rounded font-mono" x-text="c.trackingId || '—'"></code>
                        </div>

                        <div class="text-xs text-gray-700 truncate pr-2" x-text="c.siteName"></div>

                        <div>
                          <p class="text-xs text-gray-800" x-text="formatDate(c.createdAt)"></p>
                          <p class="text-xs text-gray-400 font-mono mt-0.5" x-text="toUnix(c.createdAt)"></p>
                        </div>

                        <div>
                          <span x-show="c.utmSource" class="text-xs bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded" x-text="c.utmSource"></span>
                          <span x-show="!c.utmSource && c.fbclid" class="text-xs bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">Facebook</span>
                          <span x-show="!c.utmSource && c.gclid" class="text-xs bg-yellow-50 text-yellow-700 px-1.5 py-0.5 rounded">Google</span>
                          <span x-show="!c.utmSource && !c.fbclid && !c.gclid" class="text-xs text-gray-400">Direto</span>
                        </div>

                        <div class="flex items-center gap-1.5">
                          <template x-if="c.fbSentAt">
                            <span class="text-xs bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-medium">Meta</span>
                          </template>
                          <template x-if="c.gclid && !c.fbSentAt">
                            <span class="text-xs bg-yellow-50 text-yellow-700 px-1.5 py-0.5 rounded font-medium">Google</span>
                          </template>
                          <template x-if="!c.fbSentAt && !c.gclid">
                            <span class="text-xs text-gray-400">—</span>
                          </template>
                        </div>

                        <div class="text-right">
                          <span class="text-sm font-semibold text-gray-900"
                                x-text="c.value > 0 ? formatCurrency(c.value, c.currency) : '—'"></span>
                        </div>

                        <div class="flex justify-center">
                          <svg class="w-4 h-4 text-gray-400 transition-transform"
                               :class="c._aberto ? 'rotate-180' : ''"
                               fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                          </svg>
                        </div>
                      </div>

                      <!-- Detalhe expandido -->
                      <div x-show="c._aberto" x-collapse
                           class="bg-gray-50 border-t border-gray-100 px-6 py-4">
                        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">

                          <div>
                            <p class="text-xs text-gray-400 mb-1">Timestamp da venda</p>
                            <p class="text-xs font-mono text-gray-700" x-text="toUnix(c.createdAt)"></p>
                            <p class="text-xs text-gray-500 mt-0.5" x-text="formatDateFull(c.createdAt)"></p>
                          </div>

                          <div>
                            <p class="text-xs text-gray-400 mb-1">Timestamp do clique</p>
                            <p class="text-xs font-mono text-gray-700" x-text="toUnix(c.clickAt)"></p>
                            <p class="text-xs text-gray-500 mt-0.5" x-text="formatDateFull(c.clickAt)"></p>
                          </div>

                          <div>
                            <p class="text-xs text-gray-400 mb-1">fbclid</p>
                            <p class="text-xs font-mono break-all" :class="c.fbclid ? 'text-blue-700' : 'text-gray-400'"
                               x-text="c.fbclid || 'Ausente'"></p>
                          </div>

                          <div>
                            <p class="text-xs text-gray-400 mb-1">gclid</p>
                            <p class="text-xs font-mono break-all" :class="c.gclid ? 'text-yellow-700' : 'text-gray-400'"
                               x-text="c.gclid || 'Ausente'"></p>
                          </div>

                          <div x-show="c.utmSource">
                            <p class="text-xs text-gray-400 mb-1">utm_source</p>
                            <p class="text-xs text-purple-700 font-mono" x-text="c.utmSource"></p>
                          </div>

                          <div>
                            <p class="text-xs text-gray-400 mb-1">Atendente</p>
                            <p class="text-xs font-mono text-gray-700" x-text="c.selectedNumber || '—'"></p>
                          </div>

                          <div x-show="c.pageUrl" class="col-span-2">
                            <p class="text-xs text-gray-400 mb-1">Página de origem</p>
                            <p class="text-xs text-gray-700 break-all" x-text="c.pageUrl"></p>
                          </div>

                          <div>
                            <p class="text-xs text-gray-400 mb-1">Enviado à Meta</p>
                            <template x-if="c.fbSentAt">
                              <div>
                                <p class="text-xs font-mono text-gray-700" x-text="toUnix(c.fbSentAt)"></p>
                                <p class="text-xs text-gray-500 mt-0.5" x-text="formatDateFull(c.fbSentAt)"></p>
                              </div>
                            </template>
                            <template x-if="!c.fbSentAt">
                              <p class="text-xs text-gray-400">Não enviado</p>
                            </template>
                          </div>

                        </div>

                        <!-- Ação de reenvio -->
                        <div class="mt-4 pt-4 border-t border-gray-100 flex items-center gap-3">
                          <button @click.stop="reenviar(c)"
                            :disabled="c._reenviando"
                            class="text-xs font-medium px-3 py-1.5 rounded-lg border border-blue-200 text-blue-600 hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            <span x-show="!c._reenviando">↺ Reenviar para Meta CAPI</span>
                            <span x-show="c._reenviando">Reenviando...</span>
                          </button>
                          <template x-if="c._reenvioMsg">
                            <span class="text-xs" :class="c._reenvioOk ? 'text-green-600' : 'text-red-500'" x-text="c._reenvioMsg"></span>
                          </template>
                        </div>
                      </div>

                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>

          <!-- Paginação -->
          <template x-if="totalPaginas > 1">
            <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
              <span class="text-xs text-gray-400"
                x-text="`${(pagina-1)*porPagina+1}–${Math.min(pagina*porPagina, total)} de ${total}`">
              </span>
              <div class="flex items-center gap-1">
                <button @click="irPagina(pagina - 1)" :disabled="pagina === 1"
                  class="px-2.5 py-1.5 text-xs border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                  ← Anterior
                </button>
                <span class="px-3 py-1.5 text-xs text-gray-500" x-text="`${pagina} / ${totalPaginas}`"></span>
                <button @click="irPagina(pagina + 1)" :disabled="pagina >= totalPaginas"
                  class="px-2.5 py-1.5 text-xs border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                  Próxima →
                </button>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </main>

  <script>
  function setLocale(locale) {
    document.cookie = 'locale=' + locale + ';path=/;max-age=31536000';
    location.reload();
  }
</script>
  <script>
    function conversoesList() {
      return {
        conversoes: [],
        sites: [],
        carregando: true,
        total: 0,
        totalValor: 0,
        pagina: 1,
        porPagina: 25,
        filtroSite: '',
        filtroDias: '',

        get totalPaginas() { return Math.max(1, Math.ceil(this.total / this.porPagina)); },

        async init() { await this.carregar(); },

        async carregar() {
          this.carregando = true;
          const offset = (this.pagina - 1) * this.porPagina;
          const params = new URLSearchParams({
            limit: this.porPagina,
            offset,
            ...(this.filtroSite ? { siteId: this.filtroSite } : {}),
            ...(this.filtroDias ? { days: this.filtroDias } : {}),
          });
          const res = await fetch(`/api/conversions?${params}`);
          if (res.ok) {
            const data = await res.json();
            this.conversoes = (data.items || []).map(c => ({ ...c, _aberto: false, _reenviando: false, _reenvioMsg: null, _reenvioOk: false }));
            this.total = data.total || 0;
            this.sites = data.sites || [];
            this.totalValor = this.conversoes.reduce((s, c) => s + (c.value || 0), 0);
          }
          this.carregando = false;
        },

        async reenviar(c) {
          c._reenviando = true;
          c._reenvioMsg = null;
          try {
            const res = await fetch(`/api/conversions/${c.id}/resend`, { method: 'POST' });
            const data = await res.json();
            if (res.ok && data.sucesso) {
              c._reenvioOk = true;
              c._reenvioMsg = 'Reenviado com sucesso!';
              c.fbSentAt = data.fbSentAt;
            } else {
              c._reenvioOk = false;
              c._reenvioMsg = data.erro || 'Erro ao reenviar';
            }
          } catch {
            c._reenvioOk = false;
            c._reenvioMsg = 'Falha de conexão';
          } finally {
            c._reenviando = false;
          }
        },

        async irPagina(n) {
          if (n < 1 || n > this.totalPaginas) return;
          this.pagina = n;
          await this.carregar();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        formatDate(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit', year: '2-digit',
            hour: '2-digit', minute: '2-digit',
          });
        },

        formatDateFull(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            timeZoneName: 'short',
          });
        },

        toUnix(iso) {
          if (!iso) return '—';
          return Math.floor(new Date(iso).getTime() / 1000).toString();
        },

        formatCurrency(value, currency) {
          if (!value) return '';
          const sym = { BRL: 'R$', USD: '$', EUR: '€' };
          return `${sym[currency] || currency} ${parseFloat(value).toFixed(2).replace('.', ',')}`;
        },
      };
    }
  </script>
</body>
</html>
