<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Venda — WA CAPI Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#25D366', 'wa-dark': '#128C7E' } } } }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-wa rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">WA CAPI</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">Início</a>
      <a href="/dashboard/sites" class="text-sm text-gray-600 hover:text-gray-900">Sites</a>
      <a href="/billing" class="text-sm text-gray-600 hover:text-gray-900">Assinatura</a>
      <a href="/dashboard/conversoes/registrar" class="bg-wa text-white text-sm font-medium px-3 py-1.5 rounded-lg">+ Registrar Venda</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">Sair</a>
    </div>
  </nav>
  {{subscriptionBanner}}
  <main class="max-w-lg mx-auto px-4 py-6"
    x-data="registrar()"
    x-init="init()">

    <div class="mb-6">
      <h1 class="text-xl font-bold text-gray-900">Registrar Venda</h1>
      <p class="text-gray-500 text-sm mt-1">Informe o ID da conversa recebido pelo WhatsApp para registrar a conversão no Facebook.</p>
    </div>

    <!-- Resultado final -->
    <template x-if="resultado">
      <div :class="resultado.sucesso ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'"
           class="rounded-xl border p-5 mb-5">
        <p class="font-semibold text-base mb-1" x-text="resultado.sucesso ? '✅ Conversão registrada!' : '❌ Erro ao registrar'"></p>
        <p class="text-sm" x-text="resultado.mensagem"></p>
        <button x-show="resultado.sucesso" @click="resetar()" class="mt-3 text-sm underline">Registrar outra venda</button>
      </div>
    </template>

    <template x-if="!resultado">
      <div class="space-y-4">

        <!-- Campo do ID -->
        <div class="bg-white rounded-xl border border-gray-100 p-5">
          <label class="block text-sm font-semibold text-gray-900 mb-2">ID da Conversa <span class="text-red-500">*</span></label>
          <input
            type="text"
            x-model="trackingId"
            @blur="buscarEvento()"
            @input="eventoEncontrado = null; erroId = null"
            placeholder="WA-8F3K2P"
            autocomplete="off"
            class="w-full px-3 py-3 border border-gray-300 rounded-lg text-center text-lg font-mono font-bold tracking-widest uppercase focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent"
            :class="erroId ? 'border-red-300' : ''"
          />
          <p class="text-xs text-gray-400 mt-1.5">Digite o ID que o cliente enviou na mensagem do WhatsApp</p>

          <template x-if="erroId">
            <p class="mt-2 text-sm text-red-600" x-text="erroId"></p>
          </template>

          <template x-if="buscando">
            <div class="mt-3 text-sm text-gray-400">Buscando...</div>
          </template>

          <template x-if="eventoEncontrado && !buscando">
            <div class="mt-3 p-3 rounded-lg border"
                 :class="eventoEncontrado.jaConvertido ? 'bg-yellow-50 border-yellow-200' : 'bg-green-50 border-green-200'">
              <p class="text-xs font-medium mb-2"
                 :class="eventoEncontrado.jaConvertido ? 'text-yellow-800' : 'text-green-800'"
                 x-text="eventoEncontrado.jaConvertido ? '⚠️ Este ID já foi convertido anteriormente' : '✅ Clique encontrado!'"></p>
              <div class="space-y-1 text-xs text-gray-600">
                <p><span class="font-medium">Site:</span> <span x-text="eventoEncontrado.siteName || '—'"></span></p>
                <p><span class="font-medium">Data do clique:</span> <span x-text="formatDate(eventoEncontrado.createdAt)"></span></p>
                <p><span class="font-medium">Página:</span> <span x-text="eventoEncontrado.pageUrl || '—'" class="break-all"></span></p>
                <p><span class="font-medium">fbclid:</span>
                  <span x-text="eventoEncontrado.fbclid ? 'Sim ✓' : 'Não'"></span>
                  <template x-if="!eventoEncontrado.fbclid">
                    <span class="text-orange-500 ml-1">(sem dados de anúncio — conversão será enviada sem fbclid)</span>
                  </template>
                </p>
              </div>
            </div>
          </template>
        </div>

        <!-- Valor e moeda -->
        <div class="bg-white rounded-xl border border-gray-100 p-5">
          <label class="block text-sm font-semibold text-gray-900 mb-3">Valor da Venda <span class="text-red-500">*</span></label>
          <div class="flex gap-3">
            <select x-model="currency" class="px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa">
              <option value="BRL">R$ (BRL)</option>
              <option value="USD">$ (USD)</option>
              <option value="EUR">€ (EUR)</option>
            </select>
            <input
              type="number"
              x-model="value"
              placeholder="297,00"
              min="0.01"
              step="0.01"
              class="flex-1 px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-wa"
            />
          </div>
        </div>

        <!-- Botão -->
        <button
          @click="registrar()"
          :disabled="enviando || !trackingId || !value"
          class="w-full bg-wa hover:bg-wa-dark disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3.5 rounded-xl text-base transition-colors"
        >
          <span x-show="!enviando">Registrar Conversão no Facebook</span>
          <span x-show="enviando">Enviando para o Facebook...</span>
        </button>

        <p class="text-center text-xs text-gray-400">
          A conversão será enviada como <strong>Purchase</strong> para o Pixel configurado no site.
        </p>
      </div>
    </template>
  </main>

  <script>
    const SITES_DATA = {{sitesJSON}};
    const PRESELECTED_SITE = '{{preselectedSite}}';

    function registrar() {
      return {
        trackingId: '',
        value: '',
        currency: 'BRL',
        eventoEncontrado: null,
        buscando: false,
        erroId: null,
        enviando: false,
        resultado: null,

        init() {},

        async buscarEvento() {
          const id = this.trackingId.trim().toUpperCase();
          if (!id || id.length < 3) return;
          this.buscando = true;
          this.erroId = null;
          this.eventoEncontrado = null;

          try {
            const res = await fetch(`/api/events/lookup/${encodeURIComponent(id)}`);
            const data = await res.json();
            if (!res.ok) {
              this.erroId = data.erro || 'ID não encontrado';
            } else {
              this.eventoEncontrado = data;
            }
          } catch (e) {
            this.erroId = 'Falha ao buscar o ID. Verifique sua conexão.';
          } finally {
            this.buscando = false;
          }
        },

        async registrar() {
          if (!this.trackingId || !this.value) return;
          this.enviando = true;

          try {
            const res = await fetch('/api/conversions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                trackingId: this.trackingId.trim().toUpperCase(),
                value: parseFloat(this.value),
                currency: this.currency,
              }),
            });

            const data = await res.json();

            if (res.ok && data.sucesso) {
              this.resultado = { sucesso: true, mensagem: 'A conversão foi enviada com sucesso para o Facebook CAPI.' };
            } else if (res.status === 207) {
              this.resultado = { sucesso: false, mensagem: `Conversão salva, mas erro na API do Facebook: ${data.erro}` };
            } else {
              this.resultado = { sucesso: false, mensagem: data.erro || 'Erro desconhecido ao registrar.' };
            }
          } catch (e) {
            this.resultado = { sucesso: false, mensagem: 'Falha de conexão. Tente novamente.' };
          } finally {
            this.enviando = false;
          }
        },

        resetar() {
          this.trackingId = '';
          this.value = '';
          this.eventoEncontrado = null;
          this.erroId = null;
          this.resultado = null;
        },

        formatDate(iso) {
          if (!iso) return '—';
          return new Date(iso).toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        }
      };
    }
  </script>
</body>
</html>
