<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{pageTitle}} — MeuFluxo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#18181b', 'wa-dark': '#000000' } } } }</script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- Sidebar / Nav -->
  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center shrink-0">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 3-2 3H3V7z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10h6"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7h3a3 3 0 010 6h-3"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">MeuFluxo</span>
    </div>

    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">Início</a>
      <a href="/dashboard/sites" class="text-sm text-gray-600 hover:text-gray-900">Sites</a>
      <a href="/dashboard/conversoes/registrar" class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">
        + Registrar Venda
      </a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">Sair</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {{content}}
  </main>

</body>
</html>
