<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faturas PIX — WA CAPI Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { wa: '#25D366', 'wa-dark': '#128C7E' } } } }</script>
</head>
<body class="min-h-screen bg-gray-50">

  <nav class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-wa rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.815 0 00-3.48-8.413z"/>
        </svg>
      </div>
      <span class="font-bold text-gray-900 text-sm">WA CAPI</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/dashboard" class="text-sm text-gray-600 hover:text-gray-900">Início</a>
      <a href="/dashboard/sites" class="text-sm text-gray-600 hover:text-gray-900">Sites</a>
      <a href="/faturas" class="text-sm font-medium text-gray-900">Faturas PIX</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-gray-600">Sair</a>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Faturas PIX</h1>
        <p class="text-gray-500 text-sm mt-1">Crie cobranças e acompanhe pagamentos via FastDePix.</p>
      </div>
    </div>

    <!-- Formulário nova fatura -->
    <div class="bg-white rounded-xl border border-gray-200 p-6 mb-8">
      <h2 class="font-semibold text-gray-900 mb-4">Nova Fatura</h2>
      <form id="formFatura" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Valor (R$) *</label>
            <input id="amount" type="number" min="10" step="0.01" placeholder="100,00"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa focus:border-transparent" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome do pagador <span class="text-gray-400">(opcional)</span></label>
            <input id="name" type="text" placeholder="João Silva"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CPF <span class="text-gray-400">(opcional)</span></label>
            <input id="cpf_cnpj" type="text" placeholder="12345678901" maxlength="14"
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-wa" />
          </div>
        </div>
        <p class="text-xs text-gray-400">Para valores ≥ R$ 500,00, CPF e nome são obrigatórios.</p>
        <div id="erroFatura" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
        <button type="submit" id="btnCriar"
          class="bg-wa hover:bg-wa-dark text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors disabled:opacity-50">
          Gerar QR Code PIX
        </button>
      </form>
    </div>

    <!-- Modal QR Code -->
    <div id="modalQR" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-900">Fatura Gerada</h3>
          <button onclick="fecharModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>

        <div class="text-center mb-4">
          <p class="text-2xl font-bold text-gray-900 mb-1" id="modalValor"></p>
          <p class="text-xs text-gray-400">ID: <span id="modalId" class="font-mono"></span></p>
          <span id="modalStatus" class="inline-block mt-2 px-2 py-0.5 rounded-full text-xs font-medium"></span>
        </div>

        <img id="modalQRImg" src="" alt="QR Code PIX" class="w-40 h-40 mx-auto rounded-lg border border-gray-100 mb-4" />

        <div class="mb-4">
          <label class="block text-xs text-gray-500 mb-1">Copia e Cola PIX</label>
          <div class="flex gap-2">
            <input id="modalPixText" type="text" readonly
              class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-xs font-mono bg-gray-50 focus:outline-none" />
            <button onclick="copiarPix()" class="bg-wa hover:bg-wa-dark text-white text-xs font-medium px-3 py-2 rounded-lg transition-colors whitespace-nowrap">
              Copiar
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="verificarStatus()" id="btnStatus"
            class="flex-1 border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium py-2 rounded-lg transition-colors">
            Verificar Status
          </button>
          <button onclick="fecharModal()"
            class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 rounded-lg transition-colors">
            Fechar
          </button>
        </div>
      </div>
    </div>

    <!-- Lista de faturas -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="font-semibold text-gray-900">Faturas Recentes</h2>
        <button onclick="location.reload()" class="text-xs text-gray-400 hover:text-gray-600">Atualizar</button>
      </div>

      <div id="listaFaturas">
        <div class="px-6 py-8 text-center text-gray-400 text-sm">Carregando...</div>
      </div>
    </div>
  </main>

  <script>
    const TRANSACTIONS = {{transactionsJson}};

    const STATUS_LABEL = {
      pending:    { label: 'Aguardando',   cls: 'bg-amber-100 text-amber-700' },
      approved:   { label: 'Aprovado',     cls: 'bg-blue-100 text-blue-700' },
      paid:       { label: 'Pago',         cls: 'bg-green-100 text-green-700' },
      under_review:{ label: 'Em análise',  cls: 'bg-purple-100 text-purple-700' },
      refunded:   { label: 'Reembolsado',  cls: 'bg-gray-100 text-gray-600' },
      expired:    { label: 'Expirado',     cls: 'bg-red-100 text-red-500' },
      cancelled:  { label: 'Cancelado',    cls: 'bg-red-100 text-red-500' },
    };

    function statusBadge(status) {
      const s = STATUS_LABEL[status] || { label: status, cls: 'bg-gray-100 text-gray-600' };
      return `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${s.cls}">${s.label}</span>`;
    }

    function fmtBRL(v) {
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
    }

    function renderLista(txs) {
      const el = document.getElementById('listaFaturas');
      if (!txs.length) {
        el.innerHTML = '<div class="px-6 py-8 text-center text-gray-400 text-sm">Nenhuma fatura encontrada. Crie a primeira acima!</div>';
        return;
      }
      el.innerHTML = txs.map(tx => `
        <div class="px-6 py-4 border-b border-gray-50 last:border-0 flex items-center justify-between gap-4">
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900">${fmtBRL(tx.amount)}</p>
            <p class="text-xs text-gray-400 mt-0.5">ID ${tx.id} · ${tx.user?.name || 'Anônimo'} · ${new Date(tx.created_at).toLocaleString('pt-BR')}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${statusBadge(tx.status)}
            <button onclick="abrirFaturaExistente(${tx.id})"
              class="text-xs text-wa hover:text-wa-dark font-medium">Ver</button>
          </div>
        </div>
      `).join('');
    }

    renderLista(TRANSACTIONS);

    // ---- Modal ----
    let faturaAtual = null;

    function abrirModal(data) {
      faturaAtual = data;
      document.getElementById('modalValor').textContent = fmtBRL(data.amount);
      document.getElementById('modalId').textContent = data.id;
      setModalStatus(data.status);
      document.getElementById('modalQRImg').src = data.qr_code || '';
      document.getElementById('modalPixText').value = data.qr_code_text || '';
      document.getElementById('modalQR').classList.remove('hidden');
    }

    function setModalStatus(status) {
      const el = document.getElementById('modalStatus');
      const s = STATUS_LABEL[status] || { label: status, cls: 'bg-gray-100 text-gray-600' };
      el.textContent = s.label;
      el.className = `inline-block mt-2 px-2 py-0.5 rounded-full text-xs font-medium ${s.cls}`;
    }

    function fecharModal() {
      document.getElementById('modalQR').classList.add('hidden');
      faturaAtual = null;
    }

    function copiarPix() {
      const txt = document.getElementById('modalPixText').value;
      navigator.clipboard.writeText(txt).then(() => alert('Código PIX copiado!'));
    }

    async function verificarStatus() {
      if (!faturaAtual) return;
      const btn = document.getElementById('btnStatus');
      btn.textContent = 'Verificando...';
      btn.disabled = true;
      try {
        const res = await fetch(`/faturas/status/${faturaAtual.id}`);
        const json = await res.json();
        if (json.success) {
          faturaAtual = json.data;
          setModalStatus(json.data.status);
          alert(`Status atual: ${STATUS_LABEL[json.data.status]?.label || json.data.status}`);
        }
      } finally {
        btn.textContent = 'Verificar Status';
        btn.disabled = false;
      }
    }

    async function abrirFaturaExistente(id) {
      const res = await fetch(`/faturas/status/${id}`);
      const json = await res.json();
      if (json.success) abrirModal(json.data);
    }

    // ---- Criar fatura ----
    document.getElementById('formFatura').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnCriar');
      const erroEl = document.getElementById('erroFatura');
      erroEl.classList.add('hidden');
      btn.textContent = 'Gerando...';
      btn.disabled = true;

      try {
        const amount = parseFloat(document.getElementById('amount').value);
        const name = document.getElementById('name').value.trim();
        const cpf_cnpj = document.getElementById('cpf_cnpj').value.trim().replace(/\D/g, '');

        const body = { amount };
        if (name) body.name = name;
        if (cpf_cnpj) body.cpf_cnpj = cpf_cnpj;

        const res = await fetch('/faturas/criar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const json = await res.json();

        if (json.success) {
          // Insere no topo da lista
          TRANSACTIONS.unshift(json.data);
          renderLista(TRANSACTIONS);
          abrirModal(json.data);
          e.target.reset();
        } else {
          erroEl.textContent = json.message || 'Erro ao criar fatura.';
          erroEl.classList.remove('hidden');
        }
      } catch {
        erroEl.textContent = 'Erro de conexão. Tente novamente.';
        erroEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Gerar QR Code PIX';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
